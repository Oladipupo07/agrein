services:
  - type: web
    name: agrein-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: INTERSWITCH_ENV
        value: production
      - key: INTERSWITCH_MERCHANT_CODE
        sync: false
      - key: INTERSWITCH_PAY_ITEM_ID
        sync: false
      - key: INTERSWITCH_CLIENT_ID
        sync: false
      - key: INTERSWITCH_SECRET_KEY
        sync: false
    healthCheckPath: /api/status
