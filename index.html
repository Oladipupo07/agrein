<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes, maximum-scale=5, interactive-widget=resizes-content">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Agrein">
  <meta name="theme-color" content="#059669">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#022c22">
  <!-- Primary SEO Meta Tags -->
  <title>Agrein — Nigeria's Premier Agricultural Marketplace & Direct Farm Trade</title>
  <meta name="title" content="Agrein — Nigeria's Premier Agricultural Marketplace & Direct Farm Trade">
  <meta name="description" content="Connect directly with 14,800+ verified smallholder farmers across 36 Nigerian states. Buy and sell grains, tubers, cash crops, and livestock with secure escrow protection, cold-chain logistics, and AI harvest price forecasting.">
  <meta name="keywords" content="agriculture marketplace Nigeria, buy crops direct from farmers, sell harvest Nigeria, farm produce B2B wholesale, yellow maize, sesame seeds, cassava tubers, organic farming, Escrow crop payment, agribusiness Africa, crop price forecast, cold chain logistics Nigeria">
  <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1">
  <meta name="author" content="Agrein Technologies">
  <meta name="publisher" content="Agrein Technologies">
  <link rel="canonical" href="https://agrein.ng/">

  <!-- Performance: warm DNS + TLS to third-party origins we always hit -->
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://images.unsplash.com" crossorigin>
  <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
  <link rel="dns-prefetch" href="https://images.unsplash.com">

  <!-- Open Graph / Facebook / WhatsApp / LinkedIn Meta Tags -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="en_NG">
  <meta property="og:url" content="https://agrein.ng/">
  <meta property="og:site_name" content="Agrein Marketplace">
  <meta property="og:title" content="Agrein — Nigeria's Premier Agricultural Marketplace & Direct Farm Trade">
  <meta property="og:description" content="Direct agricultural trade across 36 Nigerian states. Connect with 14,800+ verified farmers, 100% escrow protection, and AI harvest price analytics.">
  <meta property="og:image" content="https://images.unsplash.com/photo-1500937386664-56d1dfef3854?auto=format&fit=crop&w=1200&q=75">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Agrein Agricultural Marketplace Fresh Harvest">

  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@AgreinMarket">
  <meta name="twitter:creator" content="@AgreinMarket">
  <meta name="twitter:url" content="https://agrein.ng/">
  <meta name="twitter:title" content="Agrein — Connecting Farmers to Buyers, One Harvest at a Time">
  <meta name="twitter:description" content="Direct agricultural trade across 36 Nigerian states. Zero middleman exploitation, 100% escrow protection, and AI harvest price forecasting.">
  <meta name="twitter:image" content="https://images.unsplash.com/photo-1500937386664-56d1dfef3854?auto=format&fit=crop&w=1200&q=75">

  <!-- JSON-LD Structured Data: Organization & WebSite -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Organization",
        "@id": "https://agrein.ng/#organization",
        "name": "Agrein",
        "url": "https://agrein.ng/",
        "logo": "https://images.unsplash.com/photo-1500937386664-56d1dfef3854?auto=format&fit=crop&w=500&q=80",
        "sameAs": [
          "https://twitter.com/AgreinMarket",
          "https://facebook.com/AgreinMarket",
          "https://linkedin.com/company/agrein"
        ],
        "contactPoint": {
          "@type": "ContactPoint",
          "telephone": "+234-800-AGREIN-NG",
          "contactType": "customer service",
          "areaServed": "NG",
          "availableLanguage": ["English", "Hausa", "Yoruba", "Igbo"]
        },
        "description": "Africa's trusted agricultural technology marketplace connecting smallholder farmers directly to wholesale and retail buyers with escrow guarantee."
      },
      {
        "@type": "WebSite",
        "@id": "https://agrein.ng/#website",
        "url": "https://agrein.ng/",
        "name": "Agrein Agricultural Marketplace",
        "publisher": {
          "@id": "https://agrein.ng/#organization"
        },
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://agrein.ng/#marketplace?search={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    ]
  }
  </script>

  <!-- Compiled Tailwind CSS + Custom Styles -->
  <link rel="stylesheet" href="/styles.css">

  <!-- Font Awesome 6 — UI icons (fa-solid, fa-brands, etc.) -->
  <!-- Non-blocking load: tell browser this CSS isn't critical for first paint, swap media once fetched -->
  <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" as="style" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous"></noscript>

  <!-- PWA Manifest & Multi-Device Icons -->
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/icon-512.png">
  <link rel="apple-touch-icon" sizes="152x152" href="/icon-512.png">
  <link rel="mask-icon" href="/icon-512.png" color="#059669">
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-gray-100 antialiased selection:bg-emerald-500 selection:text-white touch-scroll">
  
  <!-- Root App Container -->
  <div id="app"></div>

  <!-- Utilities & Storage -->
  <script defer src="./client/utils/storageManager.js"></script>
  <script defer src="./client/data/mockData.js"></script>

  <!-- Core App Components (Homepage, Authentication, Navbar, Footer) -->
  <script defer src="./client/components/Navbar.js"></script>
  <script defer src="./client/components/Hero.js"></script>
  <script defer src="./client/components/AuthModal.js"></script>
  <script defer src="./client/components/Footer.js"></script>

  <!-- App Orchestrator -->
  <script defer src="./app.js"></script>

  <!-- PWA wiring (SW register + beforeinstallprompt + notification permission)
       lives in app.js's DOMContentLoaded bootstrap, which keeps everything in
       one place and avoids duplicate listeners. -->
</body>
</html>
