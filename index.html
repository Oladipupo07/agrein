  <!-- PWA Service Worker Registration -->
  <script>
    // Register Service Worker for PWA functionality
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(registration => {
            console.log('✅ Service Worker registered:', registration.scope);
            // Check for updates periodically
            setInterval(() => {
              registration.update();
            }, 60000); // Check every minute
          })
          .catch(error => console.warn('⚠️ Service Worker registration failed:', error));
      });

      // Listen for updates to the service worker
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        console.log('🔄 New Service Worker activated');
        // Optionally show a notification to the user about app update
      });
    }

    // Request notification permission for push updates
    if ('Notification' in window && Notification.permission === 'default') {
      Notification.requestPermission();
    }

    // Add to Home Screen prompt handling
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', e => {
      e.preventDefault();
      deferredPrompt = e;
      console.log('💾 Install prompt ready');
    });

    // Expose install function globally for app to use
    window.installApp = () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(choiceResult => {
          if (choiceResult.outcome === 'accepted') {
            console.log('✅ App installed');
          }
          deferredPrompt = null;
        });
      }
    };
  </script>
