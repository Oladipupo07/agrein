<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>You're offline · Agrein</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#059669">
  <link rel="stylesheet" href="/styles.css">
  <style>
    body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background: #f8fafc; color: #0f172a; margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
    .card { max-width: 420px; width: 100%; background: #fff; border-radius: 1.5rem; box-shadow: 0 25px 50px -12px rgba(0,0,0,.15); padding: 2rem; text-align: center; border: 1px solid #e5e7eb; }
    .icon { width: 64px; height: 64px; border-radius: 1rem; background: linear-gradient(135deg, #047857, #f59e0b); display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; color: #fff; font-size: 1.75rem; }
    h1 { font-family: 'Outfit', sans-serif; font-size: 1.375rem; font-weight: 800; margin: 0 0 .5rem; color: #064e3b; }
    p { font-size: .875rem; line-height: 1.5; color: #475569; margin: 0 0 1.25rem; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; padding: .75rem 1.25rem; border-radius: 1rem; background: #047857; color: #fff; font-weight: 800; font-size: .875rem; border: none; cursor: pointer; }
    .btn:hover { background: #065f46; }
    .muted { font-size: .75rem; color: #94a3b8; margin-top: 1rem; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🌾</div>
    <h1>You're offline</h1>
    <p>Agrein can't reach the internet right now. Cached pages and offline features are still available.</p>
    <button class="btn" onclick="location.reload()">Try again</button>
    <div class="muted" id="status">Checking connection…</div>
  </div>
  <script>
    function tick() {
      const el = document.getElementById('status');
      el.textContent = navigator.onLine ? 'Back online — reloading…' : 'Still offline — pull down to refresh when signal returns.';
    }
    window.addEventListener('online', () => { tick(); setTimeout(() => location.reload(), 500); });
    window.addEventListener('offline', tick);
    tick();
  </script>
</body>
</html>
